name: Deploy demo to Render

# 把「交互式 demo」自动部署到 Render 的免费 Python 实例，不依赖任何第三方托管平台。
#
# 需要两个仓库 Secret（Settings → Secrets and variables → Actions）：
#   RENDER_DEPLOY_HOOK_URL  Render 服务页 → Settings → Deploy Hook 的完整 URL
#   RENDER_APP_URL          服务的公开地址，如 https://comment-distillery.onrender.com
#
# 未配置 Secret 时本工作流只打印告警并成功退出——不会因为「还没开通 Render」
# 就把 main 的 CI 变红。

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "examples/**"
      - "SKILL.md"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL 未配置，跳过触发（若 Render 已开启 autoDeploy，push 会自动部署）"
            exit 0
          fi
          echo "触发 Render 部署…"
          curl -fsS "$HOOK" >/dev/null
          echo "已触发。"

      - name: Wait for the demo to come up
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::RENDER_APP_URL 未配置，跳过健康检查"
            exit 0
          fi
          # Render 免费实例冷启动可能要 30–60s；最多等 5 分钟。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/hello" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ demo 已就绪：$APP_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::健康检查超时（5 分钟）——请到 Render 控制台看部署日志"
          exit 1

name: Deploy demo to Hugging Face Spaces

# 把「交互式 demo」同步到 Hugging Face Space（Docker，免卡免费），
# 不依赖任何要绑银行卡的托管平台。
#
# 需要两个仓库 Secret（Settings → Secrets and variables → Actions）：
#   HF_TOKEN   有写权限的 Hugging Face token（Settings → Access Tokens → write）
#   HF_SPACE   目标 Space，形如 TrueFurina/comment-distillery
#
# 未配置 Secret 时本工作流只打印告警并成功退出，不会把 main 的 CI 变红。

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "examples/**"
      - "contrib/**"
      - "SKILL.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24"

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: python scripts/sync_hf_space.py

      - name: Wait for the Space to come up
        env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "::warning::HF_SPACE 未配置，跳过健康检查"
            exit 0
          fi
          slug=$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | tr '/_.' '---')
          url="https://${slug}.hf.space"
          echo "checking $url"
          # 首次构建可能几分钟；最多等 10 分钟，超时只告警不失败（构建可能仍在进行）。
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url/api/hello" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ demo 已就绪：$url"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::健康检查未在 10 分钟内通过——首次 Docker 构建可能更久，请到 Space 页面看 Build 日志"

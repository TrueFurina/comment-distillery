name: Build Windows exe

# 可复现的 exe 构建：在干净的 windows runner 上打包、核验随包资源、跑完三道冒烟。
#
# 两种触发，职责不同：
#   - push tag v*  ：证明"干净环境里也能构建 + 跑通"，产物走 Artifact，**不动 Release**；
#   - workflow_dispatch + 填 tag：把该次 CI 产物正式挂到指定 Release。
#
# v1.4.0 / v1.4.1 的发布资产都是本地构建、逐项冒烟验证后手动挂上去的
# （SHA-256 见 Release 说明与官网）。本工作流供后续无人值守重建使用。
#
# 本地等价命令：
#   python scripts/make_icon.py
#   python scripts/build_exe.py --clean
#   dist\comment-distillery.exe --selfcheck
#   dist\comment-distillery.exe --selftest-run <dir>
#   dist\comment-distillery.exe --selftest-gui
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂载产物的 Release 标签（如 v1.4.1）。留空则只留 Artifact。"
        required: false
        default: ""
  push:
    tags: ["v*"]

# Windows runner 控制台默认 cp1252，脚本里的中文输出会 UnicodeEncodeError。
# 脚本自身已加 utf8_stdout() 兜底，这里再统一设一次，覆盖所有子进程。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须拉全量 tag（同上：文档一致性机验要核对 Release tag 是否存在）。
          # 这个工作流由 tag 推送触发，不加这一行时本地只有一个 tag，检查会误判。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装构建期依赖（PyInstaller 只存在于构建期，不进产物逻辑）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: 生成图标（纯标准库手写 ICO，不引入 Pillow）
        run: python scripts/make_icon.py

      - name: 打包
        run: python scripts/build_exe.py --clean

      - name: 核验产物内资源与仓库逐项一致（防陈旧副本）
        run: python scripts/build_exe.py --verify

      - name: 冒烟① 随包资源自检
        shell: pwsh
        run: |
          $exe = "dist/comment-distillery.exe"
          $rep = Join-Path $env:RUNNER_TEMP "selfcheck.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck", "--report", $rep -Wait -PassThru
          Get-Content $rep -Encoding UTF8
          if ($p.ExitCode -ne 0) { Write-Error "selfcheck 失败"; exit 1 }

      - name: 冒烟② 端到端跑通（预处理 → 打包 → 引用机验）
        shell: pwsh
        run: |
          $exe = "dist/comment-distillery.exe"
          $out = Join-Path $env:RUNNER_TEMP "cdout"
          $rep = Join-Path $env:RUNNER_TEMP "run.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest-run", $out, "--report", $rep -Wait -PassThru
          Get-Content $rep -Encoding UTF8
          if ($p.ExitCode -ne 0) { Write-Error "端到端自检失败"; exit 1 }

      # runner 无交互桌面，GUI 初始化可能不可用故不设为硬门；
      # 本地构建时这一步是必须过的（v1.0.0 本地实测 exit 0）。
      - name: 冒烟③ 真建窗口（headless runner 上允许跳过）
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "dist/comment-distillery.exe" -ArgumentList "--selftest-gui" -Wait -PassThru
          Write-Host "gui smoke exit=$($p.ExitCode)"

      - name: 文档一致性机验（版本口径 / Release tag / 锚点 / 中英对等 / 已证伪表述）
        # 用 --no-artifact 是**刻意**的：站点上记的是「已发布的那一份产物」的 SHA-256，
        # 而这里现打包得到的字节必然不同（PyInstaller 非可复现构建）。
        # 在 CI 里硬比 SHA 会逼出「永远不许重建产物」的假红线。
        # 正确的核对时机是**本地出包后**跑不带该开关的版本（见脚本 docstring）。
        run: python scripts/check_doc_consistency.py --no-artifact

      - name: 文档一致性机验 —— 判据自身的变异验证
        run: python scripts/check_doc_consistency.py --self-test

      - name: 记录产物哈希
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/comment-distillery.exe -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item dist/comment-distillery.exe).Length / 1MB, 1)
          "SHA256=$h"  | Tee-Object -FilePath dist/SHA256.txt
          "SIZE_MB=$size" | Tee-Object -FilePath dist/SHA256.txt -Append
          Write-Host "本次 CI 构建产物：$size MB  SHA256=$h"
          Write-Host "（与站点/Release 上已发布的哈希不同属正常——非可复现构建）"

      - uses: actions/upload-artifact@v4
        with:
          name: comment-distillery-exe
          path: |
            dist/comment-distillery.exe
            dist/SHA256.txt

      - name: 挂载到 Release（仅手动触发且显式给了 tag 时）
        # ⚠️ 打 tag 自动跑时**刻意不挂载**：发布资产是本地构建并逐项冒烟验证过的那一份，
        #    其 SHA-256 已写进 Release 说明与官网。CI 重新打包得到的字节不同
        #    （PyInstaller 非可复现构建），自动 --clobber 覆盖会让那两处声明当场失真。
        #    所以 tag 触发的职责是"证明干净环境里也能构建+跑通"，产物走 Artifact；
        #    要把某个 CI 产物正式发出去，用 workflow_dispatch 并显式填 tag。
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "见仓库 CHANGELOG" }
          gh release upload $tag dist/comment-distillery.exe dist/SHA256.txt --clobber

name: Deploy site

# 官网是纯静态单文件（site/index.html），用官方 Pages 动作直接发布。
# 不走「分支根目录 /docs」那条路：docs/ 里是 Markdown 文档，根路径没有 index.html。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送打断排队中的旧任务，但不打断正在跑的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 站点自检（单文件、无外链依赖、关键锚点齐全）
        # 判据统一走 scripts/check_doc_consistency.py，不在这里再写第三份内联实现——
        # 同一件事三处各写一遍，改一处忘另两处就是漂移（本仓库最忌讳的那类问题）。
        # 该脚本的第 4 项检查正是「官网结构」。
        run: python3 scripts/check_doc_consistency.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

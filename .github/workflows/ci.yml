name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（stdlib compileall）
        run: python -m compileall -q scripts/ tests/ golden/ app/ contrib/

      - name: 守卫「零依赖」承诺
        run: |
          if grep -rEn '^[[:space:]]*(import|from)[[:space:]]+(requests|urllib3|pandas|numpy|bs4|lxml|aiohttp|httpx)\b' scripts/ tests/ app/ contrib/; then
            echo "::error::核心代码引入了第三方依赖，违反零依赖承诺"
            exit 1
          fi
          echo "✅ scripts/ tests/ app/ contrib/ 均未引入第三方依赖（tkinter 属标准库）"

      - name: 编码守卫（cp1252 控制台下 print 中文不得崩溃）
        # 实锤过的坑：Windows 控制台默认 cp1252，脚本 print 中文会 UnicodeEncodeError。
        # GitHub 的 windows runner 就这样让整个构建步骤失败过——报错看着像逻辑错，其实是编码错。
        # 这里在 cp1252 下跑一遍最"话多"的脚本，锁死这类回归。
        run: |
          sha_before=$(sha256sum assets/icon.ico | cut -d' ' -f1)
          PYTHONIOENCODING=cp1252 python scripts/make_icon.py
          sha_after=$(sha256sum assets/icon.ico | cut -d' ' -f1)
          if [ "$sha_before" != "$sha_after" ]; then
            echo "::error::图标生成不确定（重跑字节不同）——产物不可复现"
            exit 1
          fi
          PYTHONIOENCODING=cp1252 python scripts/check_rule_tags.py
          PYTHONIOENCODING=cp1252 python scripts/prep.py examples/sample_corpus.csv /tmp/cd-enc
          PYTHONIOENCODING=cp1252 python scripts/verify_citations.py examples/sample_guide.md examples/sample_corpus.csv
          echo "✅ cp1252 控制台下中文输出正常（降级替换而非抛异常）；图标生成可复现"

      - name: 官网自检（单文件 / 无外链资源 / 锚点齐全）
        run: |
          python - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path("site/index.html").read_text(encoding="utf-8")
          bad = re.findall(r'(?:src|href)="https?://[^"]+\.(?:js|css|woff2?)"', html)
          if bad:
              print("发现外链资源：", bad); sys.exit(1)
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          missing = sorted(set(re.findall(r'href="#([^"]+)"', html)) - ids)
          if missing:
              print("导航锚点无对应元素：", missing); sys.exit(1)
          for tag in ("<html", "</html>", "<head>", "</head>", "<body>", "</body>"):
              if tag not in html:
                  print("缺少结构标签：", tag); sys.exit(1)
          print(f"✅ 官网自检通过：{len(html)} 字符 / {len(ids)} 个锚点目标")
          PY

      - name: 回归测试（纯标准库 unittest）
        run: python -m unittest discover -s tests -v

      - name: 机验「无裸铁律」—— SKILL.md 每条规则必须带溯源标记
        run: python scripts/check_rule_tags.py

      - name: 机验「无裸铁律」—— 判据自身的变异验证
        run: python scripts/check_rule_tags.py --self-test

      - name: golden 评估集 —— 变异验证（判分器必须真的能扣分）
        run: python golden/run_golden.py --self-test

      - name: golden 评估集 —— 基线跑分（场景集与 baseline 自洽）
        run: python golden/run_golden.py --baseline

      - name: 端到端冒烟 —— 预处理合成样例
        run: python scripts/prep.py examples/sample_corpus.csv /tmp/cd-ci

      - name: 端到端冒烟 —— 引用真实性机验（必须通过）
        run: python scripts/verify_citations.py examples/sample_guide.md examples/sample_corpus.csv

      - name: 冒烟产出展示
        if: always()
        run: |
          echo "--- stats.json ---"
          cat /tmp/cd-ci/stats.json || true
          echo "--- low_score_long.txt (前 20 行) ---"
          head -20 /tmp/cd-ci/low_score_long.txt || true

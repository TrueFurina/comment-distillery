name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须拉全量 tag：文档一致性机验会核对「文档引用的 Release tag 是否真实存在」。
          # 实测坑：checkout 默认只带被推送的那一个 ref，tag 推送时本地就只有一个 tag，
          # 于是文档里对其他版本的引用会被误判为「引用了不存在的 tag」。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（stdlib compileall）
        run: python -m compileall -q scripts/ tests/ golden/ app/ contrib/

      - name: 守卫「零依赖」承诺
        run: |
          if grep -rEn '^[[:space:]]*(import|from)[[:space:]]+(requests|urllib3|pandas|numpy|bs4|lxml|aiohttp|httpx)\b' scripts/ tests/ app/ contrib/; then
            echo "::error::核心代码引入了第三方依赖，违反零依赖承诺"
            exit 1
          fi
          echo "✅ scripts/ tests/ app/ contrib/ 均未引入第三方依赖（tkinter 属标准库）"

      - name: 编码守卫（cp1252 控制台下 print 中文不得崩溃）
        # 实锤过的坑：Windows 控制台默认 cp1252，脚本 print 中文会 UnicodeEncodeError。
        # GitHub 的 windows runner 就这样让整个构建步骤失败过——报错看着像逻辑错，其实是编码错。
        # 这里在 cp1252 下跑一遍最"话多"的脚本，锁死这类回归。
        run: |
          sha_before=$(sha256sum assets/icon.ico | cut -d' ' -f1)
          PYTHONIOENCODING=cp1252 python scripts/make_icon.py
          sha_after=$(sha256sum assets/icon.ico | cut -d' ' -f1)
          if [ "$sha_before" != "$sha_after" ]; then
            echo "::error::图标生成不确定（重跑字节不同）——产物不可复现"
            exit 1
          fi
          PYTHONIOENCODING=cp1252 python scripts/check_rule_tags.py
          PYTHONIOENCODING=cp1252 python scripts/prep.py examples/sample_corpus.csv /tmp/cd-enc
          PYTHONIOENCODING=cp1252 python scripts/verify_citations.py examples/sample_guide.md examples/sample_corpus.csv
          PYTHONIOENCODING=cp1252 python scripts/emit_html.py examples/sample_guide.md --corpus examples/sample_corpus.csv -o /tmp/cd-enc/report.html
          echo "✅ cp1252 控制台下中文输出正常（降级替换而非抛异常）；图标生成可复现"

      # step 名刻意**不枚举**具体检查项：每新增一项都要回来改这里，而忘改就会让名字说谎。
      # 判据的完整清单与取舍理由写在 scripts/check_doc_consistency.py 的模块文档里，以那里为准。
      - name: 文档一致性机验（口径与数字真值，判据见脚本头）
        # 为什么要有这一步：2026-09-26 一次普查漏出 3 处「文档落后于事实」
        # （PR 文案写 Python 3.8+、distribution.md §E 的「需要你的仓库权限」已被证伪、
        #  HANDOFF 里 Release 仍是待办）。**人眼 grep 会漏，机验不会。**
        # 本步同时取代了原先单独的「官网自检」——同一件事只留一处实现，避免两份判据各自漂移。
        run: python scripts/check_doc_consistency.py

      - name: 文档一致性机验 —— 判据自身的变异验证
        run: python scripts/check_doc_consistency.py --self-test

      - name: 回归测试（纯标准库 unittest）
        run: python -m unittest discover -s tests -v

      - name: 机验「无裸铁律」—— SKILL.md 每条规则必须带溯源标记
        run: python scripts/check_rule_tags.py

      - name: 机验「无裸铁律」—— 判据自身的变异验证
        run: python scripts/check_rule_tags.py --self-test

      - name: golden 评估集 —— 变异验证（判分器必须真的能扣分）
        run: python golden/run_golden.py --self-test

      - name: golden 评估集 —— 基线跑分（场景集与 baseline 自洽）
        run: python golden/run_golden.py --baseline

      - name: 端到端冒烟 —— 预处理合成样例
        run: python scripts/prep.py examples/sample_corpus.csv /tmp/cd-ci

      - name: 端到端冒烟 —— 引用真实性机验（必须通过）
        run: python scripts/verify_citations.py examples/sample_guide.md examples/sample_corpus.csv

      - name: 端到端冒烟 —— HTML 报告产出（差集非空则本步失败）
        # 交付形态的冒烟：脚本在差集非空时返回非 0，与 verify 同一条硬门。
        # 锚点零死链 / 无外链资源 / 转义竖线不误拆列 等不变量由
        # tests/test_emit_html.py 覆盖（同一件事只留一处判据）。
        run: |
          python scripts/emit_html.py examples/sample_guide.md --corpus examples/sample_corpus.csv -o /tmp/cd-ci/report.html
          echo "--- 报告首屏（信任条）---"
          grep -o 'class="trustbar[^<]*' /tmp/cd-ci/report.html || true

      - name: 端到端冒烟 —— 技能包 ZIP（可复现构建 + 结构校验）
        # 交付形态的冒烟：打包 + 结构校验（必需文件 / 排除项 / 路径安全）一次过。
        # 可复现性与"判据真能抓错"由 tests/test_make_skill_zip.py 覆盖
        # （同一件事只留一处判据）。这里只打印哈希，便于 Release 记录时直接复制。
        run: |
          python scripts/make_skill_zip.py
          python scripts/make_skill_zip.py --check dist/comment-distillery-skill-*.zip
          python scripts/make_skill_zip.py --print-sha

      - name: 端到端冒烟 —— 本地 Web 界面（路由 + 安全边界 + 端到端作业）
        # 真起一个 127.0.0.1 服务跑 HTTP，不 mock：mock 出来的"能跑"证明不了什么。
        # 覆盖路由、Host/Origin 校验、路径穿越、端到端 prep→pack→verify→emit；
        # 判据只在 tests/test_webui.py 一处，这里只负责让它真的跑起来。
        run: python -m unittest tests.test_webui -v

      - name: 冒烟产出展示
        if: always()
        run: |
          echo "--- stats.json ---"
          cat /tmp/cd-ci/stats.json || true
          echo "--- low_score_long.txt (前 20 行) ---"
          head -20 /tmp/cd-ci/low_score_long.txt || true
